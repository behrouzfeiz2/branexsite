<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خطای 404 - صفحه پیدا نشد | برانکس</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { vazir: ['Vazirmatn', 'sans-serif'] }, colors: { space: { 950: '#03040b', 900: '#070a18', 800: '#0e1530' } } } }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    /* انیمیشن معلق بودن فضانورد */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .floating-astronaut {
      animation: float 4s ease-in-out infinite;
    }
    
    /* افکت متن 404 */
    .text-404 {
      font-size: clamp(8rem, 20vw, 15rem);
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #38bdf8 50%, #1e1b4b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 20px 40px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body class="font-vazir selection:bg-indigo-500 selection:text-white overflow-hidden">

  <!-- پس‌زمینه سه‌بعدی فضا -->
  <canvas id="starfield-canvas"></canvas>

  <main class="content-wrapper min-h-screen flex items-center justify-center relative p-4 sm:p-8">
    
    <!-- نورپردازی پس‌زمینه 404 -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-500/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="glass-panel rounded-[2.5rem] p-8 sm:p-12 md:p-16 max-w-4xl w-full text-center border border-white/10 relative z-10 flex flex-col items-center">
      
      <!-- تصویرسازی 404 و فضانورد -->
      <div class="relative w-full flex justify-center items-center mb-6">
        <div class="font-black text-404 relative z-0 tracking-tighter" dir="ltr">404</div>
        
        <!-- فضانورد معلق روی عدد 4 اول -->
        <div class="absolute left-[20%] sm:left-[28%] md:left-[32%] top-0 sm:-top-8 text-5xl sm:text-7xl floating-astronaut z-10 filter drop-shadow-2xl">
          👨‍🚀
        </div>
        
        <!-- سیاره خالی از سکنه در پس‌زمینه عدد 0 -->
        <div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 text-6xl sm:text-8xl opacity-40 z-[-1] animate-pulse">
          🪐
        </div>
      </div>

      <h1 class="text-2xl sm:text-3xl font-black text-white mb-4">ارتباط با این بخش از کهکشان قطع شده است!</h1>
      <p class="text-sm sm:text-base text-slate-400 max-w-lg mx-auto leading-relaxed mb-8">
        به نظر می‌رسد سفینه شما در مسیر اشتباهی قرار گرفته یا صفحه‌ای که به دنبال آن بودید توسط یک سیاه‌چاله بلعیده شده است.
      </p>

      <div class="flex flex-wrap items-center justify-center gap-4">
        <a href="index.html" class="px-8 py-3.5 rounded-2xl font-bold text-sm bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white shadow-lg shadow-indigo-500/25 transition-all flex items-center gap-2">
          <span>بازگشت به پایگاه (خانه)</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 rotate-180" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </a>
        <button onclick="history.back()" class="px-8 py-3.5 rounded-2xl font-bold text-sm bg-white/5 hover:bg-white/10 border border-white/15 text-white transition-all cursor-pointer">
          مسیریابی مجدد (صفحه قبل)
        </button>
      </div>

    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
